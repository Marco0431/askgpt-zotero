<?xml version="1.0"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>AskGPT · 文献问答</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="chrome://askgpt/content/vendor/katex/katex.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="chrome://askgpt/content/popup.css"
    />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="brand">
          <span id="logo">✎</span>
          <span id="title">AskGPT</span>
          <span id="model-badge" title="当前模型">…</span>
        </div>
        <div id="actions">
          <span id="ctx-badge" class="ctx-badge hidden"
            ><span id="ctx-text"></span
          ></span>
          <span id="focus-badge" class="ctx-badge focus hidden">
            <span id="focus-label">🎯 选中 0 字</span>
            <button id="focus-clear" class="badge-x" title="清除选中段落">
              ✕
            </button>
          </span>
          <button
            id="askgpt-save-btn"
            class="icon-btn"
            title="把最后一条 AI 回答存为 Zotero 笔记"
          >
            存为笔记
          </button>
          <button id="btn-new" class="icon-btn" title="新对话">＋</button>
        </div>
      </header>

      <section id="settings" class="hidden">
        <div id="settings-head">
          <span id="settings-title">⚙ 设置</span>
          <button
            id="btn-settings-close"
            class="icon-btn"
            title="关闭设置（Esc）"
          >
            ✕
          </button>
        </div>
        <div class="form-row">
          <label>接口地址 (OpenAI 兼容)</label>
          <input
            type="text"
            id="set-base"
            placeholder="https://api.deepseek.com"
          />
        </div>
        <div class="form-row">
          <label>API Key</label>
          <input type="password" id="set-key" placeholder="sk-..." />
        </div>
        <div class="form-row">
          <label>模型</label>
          <input
            type="text"
            id="set-model"
            list="askgpt-model-list"
            placeholder="deepseek-chat"
          />
          <datalist id="askgpt-model-list">
            <option value="deepseek-chat"></option>
            <option value="deepseek-reasoner"></option>
            <option value="gpt-4o"></option>
            <option value="gpt-4o-mini"></option>
            <option value="gpt-4.1"></option>
            <option value="gpt-4.1-mini"></option>
            <option value="o3-mini"></option>
            <option value="claude-sonnet-4.5"></option>
            <option value="claude-sonnet-4.0"></option>
            <option value="claude-opus-4.1"></option>
            <option value="gemini-2.5-pro"></option>
            <option value="gemini-2.5-flash"></option>
            <option value="qwen-plus"></option>
            <option value="qwen-max"></option>
            <option value="glm-4.5"></option>
            <option value="glm-4.6"></option>
            <option value="kimi-latest"></option>
            <option value="moonshot-v1-8k"></option>
            <option value="llama3.3-70b"></option>
            <option value="mistral-large-latest"></option>
          </datalist>
        </div>
        <div class="form-row">
          <label>温度 (0~2)</label>
          <input type="number" id="set-temp" min="0" max="2" step="0.1" />
        </div>
        <div class="form-row form-row-inline">
          <div class="form-col">
            <label>字体大小</label>
            <select id="set-fontsize">
              <option value="12">12 px（紧凑）</option>
              <option value="13">13 px</option>
              <option value="14">14 px（默认）</option>
              <option value="15">15 px</option>
              <option value="16">16 px</option>
              <option value="18">18 px（大字）</option>
            </select>
          </div>
          <div class="form-col">
            <label>面板大小（宽 × 高）</label>
            <div class="panel-size">
              <input type="number" id="set-panel-w" min="420" max="1600" />
              <span>×</span>
              <input type="number" id="set-panel-h" min="360" max="1600" />
            </div>
          </div>
        </div>
        <div class="form-row">
          <label>整篇文献的来源（下次打开面板生效）</label>
          <select id="set-ctx-src">
            <option value="auto">自动：用我正在读的那个文件</option>
            <option value="pdf">PDF 优先：始终送原始 PDF 全文</option>
            <option value="translation">
              译文优先：用译文附件（公式是 LaTeX）
            </option>
          </select>
        </div>
        <div class="form-row">
          <label>系统提示词</label>
          <textarea id="set-sys" rows="5" spellcheck="false"></textarea>
        </div>
        <div class="form-row checkbox-row">
          <label
            ><input type="checkbox" id="set-web" />
            允许联网搜索（自动决定何时搜）</label
          >
        </div>
        <div class="form-actions">
          <button id="btn-save" class="primary">保存设置</button>
          <button id="btn-settings-close2" class="secondary">关闭</button>
          <span id="save-status"></span>
        </div>
      </section>

      <section id="chips">
        <button
          class="chip"
          data-q="请用中文详细解释这段话的核心内容，并说明其在该文献中的作用"
        >
          解释这段话
        </button>
        <button class="chip" data-q="请把这段话翻译成中文，尽量贴合学术语境">
          翻译成中文
        </button>
        <button class="chip" data-q="请总结这段话的主要观点，并给出三点要点">
          总结要点
        </button>
        <button
          class="chip"
          data-q="请从批判性角度评价这段话，指出可能的局限或值得推敲之处"
        >
          批判性评价
        </button>
        <button
          class="chip"
          data-q="关于这段话，联网搜索一下相关的最新研究或概念，并简要说明联系"
        >
          联网扩展阅读
        </button>
      </section>

      <main id="chat">
        <div id="messages"></div>
        <div id="empty-tip">在下面输入问题，或点上方快捷提示开始。</div>
      </main>

      <footer id="inputbar">
        <textarea
          id="input"
          rows="2"
          placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"
        ></textarea>
        <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
        <button id="btn-stop" class="secondary hidden">停止</button>
        <button id="btn-send" class="primary">发送</button>
      </footer>
      <div id="statusline"></div>
    </div>

    <!-- 离线渲染依赖（随插件打包，无需联网） -->
    <script
      type="application/javascript"
      src="chrome://askgpt/content/vendor/katex/katex.min.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://askgpt/content/vendor/markdown-it.min.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://askgpt/content/scripts/mathrender.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://askgpt/content/scripts/popup.js"
    ></script>
  </body>
</html>
