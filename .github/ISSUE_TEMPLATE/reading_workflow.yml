name: Reading workflow or feature / 阅读需求与建议
description: Describe the task you want to complete / 描述你想完成的阅读任务
body:
  - type: textarea
    id: task
    attributes:
      label: Reading task / 阅读任务
      description: What are you trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Useful outcome / 期望结果
      description: Give a concrete example of the result you need. Avoid private paper content.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround / 目前的做法
      description: How do you handle this today? This helps explain the benefit of the change.
